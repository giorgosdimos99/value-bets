name: Ενημέρωση δεδομένων

on:
  schedule:
    - cron: "17 */2 * * *"   # κάθε 2 ώρες, στο :17 (στην ακριβή ώρα το GitHub καθυστερεί ή παραλείπει τρεξίματα)
  workflow_dispatch: {}      # χειροκίνητα από το GitHub
  push:                      # και όταν αλλάζει ο κώδικας
    branches: [main]
    paths-ignore: ["site/data/**", ".cache/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Βιβλιοθήκες
        run: pip install numpy
      - name: Τρέξιμο μηχανής
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m engine.run
      - name: Αποθήκευση δεδομένων στο repo
        run: |
          git config user.name "value-bets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data .cache
          git diff --staged --quiet || git commit -m "Ενημέρωση δεδομένων"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # το ανέβασμα της σελίδας αποτυγχάνει πού και πού από την πλευρά του GitHub: δεύτερη και τρίτη προσπάθεια
      - uses: actions/deploy-pages@v4
        id: deploy1
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        id: deploy2
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
