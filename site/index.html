<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Value Bets">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg">
<title>Value Bets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">◆</span> Value Bets</div>
  <div class="updated" id="updated">—</div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="value" class="active"><span class="ic">★</span>Προβλέψεις</button>
  <button data-tab="matches"><span class="ic">⚽</span>Αγώνες</button>
  <button data-tab="teams"><span class="ic">📊</span>Ομάδες</button>
  <button data-tab="bets"><span class="ic">🎫</span>Στοιχήματα</button>
  <button data-tab="model"><span class="ic">🧪</span>Μοντέλο</button>
</nav>

<div class="comp-filter" id="compFilter">
  <button data-comp="ALL" class="active">Όλα</button>
  <button data-comp="PL">Premier League</button>
  <button data-comp="CL">Champions League</button>
  <button data-comp="GR">Super League</button>
  <button data-comp="EL">🏀 EuroLeague</button>
</div>

<main id="view"></main>

<div class="sheet-backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog"></section>

<script src="app.js"></script>
</body>
</html>
